name: Website quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    name: Static site validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate website HTML and local links
        run: python website/tests/check_site.py

      - name: Check Café Bernstein JavaScript syntax
        run: node --check website/demos/cafe-bernstein/app.js
